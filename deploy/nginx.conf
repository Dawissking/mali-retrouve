# Mali Retrouvé - Nginx Configuration
# Place this file at /etc/nginx/sites-available/maliretrouve.conf
# Then symlink: ln -s /etc/nginx/sites-available/maliretrouve.conf /etc/nginx/sites-enabled/
# Test: nginx -t
# Reload: systemctl reload nginx

# Rate limiting
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

upstream backend {
    server localhost:3000 fail_timeout=0;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name maliretrouve.ml www.maliretrouve.ml agent.maliretrouve.ml admin.maliretrouve.ml;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Main citizen portal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name maliretrouve.ml www.maliretrouve.ml;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/maliretrouve.ml/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maliretrouve.ml/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Serve citizen frontend (built with Vite)
    root /var/www/maliretrouve/dist;
    index index.html;

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS - Agent portal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agent.maliretrouve.ml;

    ssl_certificate /etc/letsencrypt/live/agent.maliretrouve.ml/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.maliretrouve.ml/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /var/www/maliretrouve/dist-agent;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS - Admin portal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.maliretrouve.ml;

    ssl_certificate /etc/letsencrypt/live/admin.maliretrouve.ml/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.maliretrouve.ml/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /var/www/maliretrouve/dist-admin;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
